<div class="page-header">
  <div>
    <div class="page-title">{{ "user-management.page-title" | translate }}</div>
    <div class="page-desc">{{ "user-management.desc" | translate }}</div>
  </div>
</div>

<div class="stats-row">
  <div class="stat-card">
    <div class="stat-label">
      {{ "user-management.total-users" | translate }}
    </div>
    <div class="stat-value">{{ getTotalUserCount() }}</div>
  </div>
</div>

<ng-container *ngIf="!isLoading">
  <div class="filter-bar">
    <div class="filter-bar-left">
      <div class="search-input-wrap">
        <span class="search-icon" [innerHTML]="searchIcon"></span>
        <input
          type="text"
          class="search-input"
          [placeholder]="'user-management.search-placeholder' | translate"
          [(ngModel)]="searchQuery"
          (input)="onSearchInput()"
          (compositionstart)="onCompositionStart()"
          (compositionend)="onCompositionEnd()"
          (keydown)="onSearchKeydown($event)"
        />
      </div>
    </div>
    <div class="filter-bar-right">
      <app-pagination-filter
        [itemsPerPage]="itemsPerPage"
        (itemsPerPageChange)="onItemsPerPageChange($event)"
      ></app-pagination-filter>
    </div>
  </div>

  <div class="table-card">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th *ngFor="let header of tableHeaders">
              {{ header.labelKey | translate }}
            </th>
            <th class="table-header-action"></th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let user of getDisplayedUsers()"
            class="table-row-clickable"
            (click)="openUserDetail(user)"
          >
            <td *ngFor="let cell of tableCells">
              {{ getTextCellValue(cell, user) }}
            </td>
            <td class="table-action-cell" (click)="$event.stopPropagation()">
              <app-action-menu
                (edit)="editUser(user)"
                (delete)="deleteUser(user)"
              ></app-action-menu>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <div class="pagination-info">
        {{ getPaginationInfo() }}
      </div>
      <div class="pagination-btns">
        <button
          class="page-btn"
          (click)="previousPage()"
          [disabled]="currentPage === 1"
        >
          <span class="page-btn-icon" [innerHTML]="chevronLeftIcon"></span>
        </button>
        <button
          *ngFor="let page of getPageNumbers()"
          class="page-btn"
          [class.active]="page === currentPage"
          [disabled]="typeof page === 'string'"
          (click)="typeof page === 'number' && goToPage(page)"
        >
          {{ page }}
        </button>
        <button
          class="page-btn"
          (click)="nextPage()"
          [disabled]="currentPage === getTotalPages() || getTotalPages() === 0"
        >
          <span class="page-btn-icon" [innerHTML]="chevronRightIcon"></span>
        </button>
      </div>
    </div>
  </div>
</ng-container>

<div *ngIf="isLoading" class="loading-container">
  <mat-spinner diameter="80" strokeWidth="3"></mat-spinner>
</div>
