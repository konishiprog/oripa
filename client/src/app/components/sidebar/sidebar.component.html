<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon" [innerHTML]="logoSvg"></div>
    <span class="sidebar-logo-text">{{ "sidebar.title" | translate }}</span>
  </div>

  <div class="sidebar-section" *ngFor="let section of menuSections">
    <div class="sidebar-section-label">{{ section.title | translate }}</div>
    <a
      *ngFor="let item of section.items"
      [routerLink]="item.route || null"
      [href]="item.route ? null : '#'"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      class="nav-item"
    >
      <span class="nav-icon" [innerHTML]="getIcon(item.icon)"></span>
      {{ item.label | translate }}
    </a>
  </div>

  <div class="sidebar-footer">
    <div
      class="user-info"
      (click)="navigateToAdminAccountList()"
      [class.active]="isAdminAccountActive"
    >
      <div class="avatar">{{ "sidebar.user.avatar" | translate }}</div>
      <div class="user-meta">
        <div class="user-name">{{ adminEmail }}</div>
        <div class="user-role">{{ "sidebar.user.role" | translate }}</div>
      </div>
    </div>
  </div>
</aside>
