<div class="container">
  <div class="form-wrapper">
    <h1>
      {{
        (isEditMode ? "admin-create.title-edit" : "admin-create.title")
          | translate
      }}
    </h1>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">{{ "admin-create.email" | translate }}</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          [disabled]="isLoading"
        />
      </div>

      <div class="form-group password-group">
        <label for="password">{{ "admin-create.password" | translate }}</label>
        <div class="password-input-wrapper">
          <input
            id="password"
            [type]="passwordVisible ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            required
            [disabled]="isLoading"
          />
          <mat-icon
            class="password-icon"
            [svgIcon]="passwordVisible ? 'visible' : 'invisible'"
            (click)="togglePasswordVisibility()"
          ></mat-icon>
        </div>
      </div>

      <div class="button-group">
        <button
          type="button"
          (click)="onClose()"
          [disabled]="isLoading"
          class="close-btn"
        >
          {{ "admin-create.close" | translate }}
        </button>
        <button type="submit" [disabled]="isLoading" class="submit-btn">
          {{
            (isEditMode ? "admin-create.submit-edit" : "admin-create.submit")
              | translate
          }}
        </button>
      </div>
    </form>
  </div>
</div>
