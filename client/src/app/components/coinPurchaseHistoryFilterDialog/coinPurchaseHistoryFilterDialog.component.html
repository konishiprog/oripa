<div class="dialog-container">
  <div class="dialog-header">
    <h2 class="dialog-title">
      {{ "coin-purchase-history.filter.title" | translate }}
    </h2>
  </div>

  <div class="dialog-content">
    <div class="filter-group">
      <label>{{
        "coin-purchase-history.filter.price-range" | translate
      }}</label>
      <div class="filter-inputs">
        <input
          type="number"
          [placeholder]="'coin-purchase-history.filter.min' | translate"
          [(ngModel)]="criteria.minPrice"
          class="filter-input"
        />
        <span class="filter-separator">{{
          "coin-purchase-history.filter.separator" | translate
        }}</span>
        <input
          type="number"
          [placeholder]="'coin-purchase-history.filter.max' | translate"
          [(ngModel)]="criteria.maxPrice"
          class="filter-input"
        />
      </div>
    </div>

    <div class="filter-group">
      <label>{{
        "coin-purchase-history.filter.coin-range" | translate
      }}</label>
      <div class="filter-inputs">
        <input
          type="number"
          [placeholder]="'coin-purchase-history.filter.min' | translate"
          [(ngModel)]="criteria.minCoin"
          class="filter-input"
        />
        <span class="filter-separator">{{
          "coin-purchase-history.filter.separator" | translate
        }}</span>
        <input
          type="number"
          [placeholder]="'coin-purchase-history.filter.max' | translate"
          [(ngModel)]="criteria.maxCoin"
          class="filter-input"
        />
      </div>
    </div>

    <div class="filter-group">
      <label>{{ "coin-purchase-history.filter.date-range" | translate }}</label>
      <div class="filter-inputs">
        <input
          type="date"
          [(ngModel)]="criteria.startDate"
          class="filter-input"
        />
        <span class="filter-separator">{{
          "coin-purchase-history.filter.separator" | translate
        }}</span>
        <input
          type="date"
          [(ngModel)]="criteria.endDate"
          class="filter-input"
        />
      </div>
    </div>

    <div class="filter-group">
      <label>{{
        "coin-purchase-history.filter.year-filter" | translate
      }}</label>
      <select [(ngModel)]="criteria.yearFilter" class="filter-select">
        <option value="">
          {{ "coin-purchase-history.filter.year-all" | translate }}
        </option>
        <option value="recent-1year">
          {{ "coin-purchase-history.filter.year-recent-1year" | translate }}
        </option>
        <option
          *ngFor="let year of yearFilterOptions"
          [value]="year.toString()"
        >
          {{ year }}{{ "coin-purchase-history.filter.year-suffix" | translate }}
        </option>
      </select>
    </div>
  </div>

  <div class="dialog-actions">
    <button class="btn btn-secondary" (click)="onReset()">
      {{ "coin-purchase-history.filter.reset" | translate }}
    </button>
    <button class="btn btn-cancel" (click)="onClose()">
      {{ "coin-purchase-history.filter.cancel" | translate }}
    </button>
    <button class="btn btn-primary" (click)="onApply()">
      {{ "coin-purchase-history.filter.apply" | translate }}
    </button>
  </div>
</div>
