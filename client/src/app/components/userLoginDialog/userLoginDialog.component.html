<div class="dialog-wrapper">
  <div class="dialog-header">
    <h2>{{ "user-login.title" | translate }}</h2>
    <button
      type="button"
      class="close-icon"
      (click)="onClose()"
      [disabled]="isLoading"
      aria-label="Close"
    >
      {{ "user-login.close" | translate }}
    </button>
  </div>

  <div class="success-message" *ngIf="successMessage">
    {{ successMessage }}
  </div>

  <div class="error-message" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="identifier">{{ "user-login.identifier" | translate }}</label>
      <input
        id="identifier"
        type="text"
        [(ngModel)]="identifier"
        name="identifier"
        required
        [disabled]="isLoading"
        [placeholder]="'user-login.identifier-placeholder' | translate"
      />
    </div>

    <div class="form-group password-group">
      <label for="password">{{ "user-login.password" | translate }}</label>
      <div class="password-input-wrapper">
        <input
          id="password"
          [type]="passwordVisible ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          required
          [disabled]="isLoading"
        />
        <mat-icon
          class="password-icon"
          [svgIcon]="passwordVisible ? 'visible' : 'invisible'"
          (click)="togglePasswordVisibility()"
        ></mat-icon>
      </div>
    </div>

    <button type="submit" [disabled]="isLoading" class="submit-btn">
      {{ "user-login.submit" | translate }}
    </button>
  </form>
</div>
