<div class="container">
  <div class="form-wrapper">
    <h1>{{ "forgot-password.title" | translate }}</h1>

    <p class="description">
      {{ "forgot-password.description" | translate }}
    </p>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">{{ "forgot-password.email" | translate }}</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          [placeholder]="'forgot-password.email-placeholder' | translate"
          required
          [disabled]="isLoading"
        />
      </div>

      <div class="form-group">
        <label for="phone">{{ "forgot-password.phone" | translate }}</label>
        <input
          id="phone"
          type="tel"
          [(ngModel)]="phone"
          name="phone"
          [placeholder]="'forgot-password.phone-placeholder' | translate"
          required
          [disabled]="isLoading"
        />
      </div>

      <button type="submit" [disabled]="isLoading" class="submit-btn">
        {{ "forgot-password.submit" | translate }}
      </button>
    </form>

    <button type="button" (click)="onBack()" class="back-btn" [disabled]="isLoading">
      {{ "forgot-password.back" | translate }}
    </button>
  </div>
</div>
