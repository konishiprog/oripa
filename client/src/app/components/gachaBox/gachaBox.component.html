<div
  class="box-card"
  [class.box-card--unavailable]="isUnavailable"
  (click)="!isUnavailable && navigateToDetail()"
>
  <div class="box-thumb">
    <img [src]="gacha.headerImage" [alt]="gacha.name" class="box-image" />
    <div class="box-overlay" *ngIf="isUnavailable">
      <span class="box-overlay-text">{{
        "gacha-box.sold-out" | translate
      }}</span>
    </div>
  </div>
  <div class="box-info">
    <div class="box-name">{{ gacha.name }}</div>
    <div class="box-badges" *ngIf="gacha.oncePerUser">
      <span class="box-badge box-badge-once">
        {{ "gacha-box.once-per-user-badge" | translate }}
      </span>
    </div>
    <div class="box-meta">
      <span class="box-price" [ngClass]="{ 'box-price-ticket': usesTicket }">
        {{ formatPrice(gacha.cost) }}
      </span>
    </div>
    <app-gacha-draw-buttons
      *ngIf="!isUnavailable"
      [gacha]="gacha"
      [isLoggedIn]="isLoggedIn"
      [isDrawing]="isDrawing"
      variant="compact"
      (drawRequested)="draw($event)"
    ></app-gacha-draw-buttons>
    <button
      *ngIf="isUnavailable"
      type="button"
      class="winners-btn"
      (click)="$event.stopPropagation(); openWinnersDialog()"
    >
      {{ "gacha-box.winners-button" | translate }}
    </button>
  </div>
</div>
