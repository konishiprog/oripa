<div
  class="box-card"
  [class.box-card--expired]="isExpired"
  (click)="!isExpired && navigateToDetail()"
>
  <div class="box-thumb">
    <img [src]="gacha.headerImage" [alt]="gacha.name" class="box-image" />
  </div>
  <div class="box-info">
    <div class="box-name">{{ gacha.name }}</div>
    <div class="box-badges" *ngIf="gacha.oncePerUser">
      <span class="box-badge box-badge-once">
        {{ "gacha-box.once-per-user-badge" | translate }}
      </span>
    </div>
    <div class="box-meta">
      <span
        class="box-price"
        [ngClass]="{ 'box-price-ticket': usesTicket }"
      >
        {{ formatPrice(gacha.cost) }}
      </span>
    </div>
    <app-gacha-draw-buttons
      *ngIf="!isExpired"
      [gacha]="gacha"
      [isLoggedIn]="isLoggedIn"
      [isDrawing]="isDrawing"
      variant="compact"
      (drawRequested)="draw($event)"
    ></app-gacha-draw-buttons>
    <div *ngIf="isExpired" class="expired-notice">
      {{ "gacha-box.expired" | translate }}
    </div>
    <button
      *ngIf="isExpired"
      type="button"
      class="winners-btn"
      (click)="$event.stopPropagation(); openWinnersDialog()"
    >
      {{ "gacha-box.winners-button" | translate }}
    </button>
  </div>
</div>
