<div class="app">
  <app-header></app-header>

  <div class="content">
    <div class="section-header">
      <div class="section-title">
        {{ "user-gacha.section-title" | translate }}
      </div>
      <button class="sort-btn" type="button" (click)="openSortDialog()">
        {{ "user-gacha.sort-button" | translate }}
      </button>
    </div>

    <div class="exchange-guide-banner">
      {{ "gacha-draw-result.exchange-guide" | translate }}
    </div>

    <div *ngIf="isLoading" class="loading-state">
      {{ "user-gacha.loading" | translate }}
    </div>

    <div *ngIf="!isLoading && gachas.length === 0" class="empty-state">
      {{ "user-gacha.empty-state" | translate }}
    </div>

    <div *ngIf="!isLoading && gachas.length > 0" class="box-grid">
      <app-gacha-box
        *ngFor="let gacha of sortedGachas"
        [gacha]="gacha"
      ></app-gacha-box>
    </div>
  </div>

  <app-footer-links></app-footer-links>
</div>
