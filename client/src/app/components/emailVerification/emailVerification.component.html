<div class="verification-container">
  <div class="verification-card">
    <div *ngIf="isVerifying" class="verifying-state">
      <mat-spinner diameter="60" strokeWidth="4"></mat-spinner>
      <h2>{{ "email-verification.verifying" | translate }}</h2>
      <p>{{ "email-verification.verifying-message" | translate }}</p>
    </div>

    <div *ngIf="!isVerifying && successMessage" class="success-state">
      <div class="success-icon">✓</div>
      <h2>{{ successMessage }}</h2>
      <p>{{ "email-verification.redirecting" | translate }}</p>
    </div>

    <div *ngIf="!isVerifying && errorMessage" class="error-state">
      <div class="error-icon">✕</div>
      <h2>{{ "email-verification.error-title" | translate }}</h2>
      <p>{{ errorMessage }}</p>
      <button
        class="back-button"
        (click)="goToSignup()"
        mat-raised-button
        color="primary"
      >
        {{ "email-verification.back-to-signup" | translate }}
      </button>
    </div>
  </div>
</div>
