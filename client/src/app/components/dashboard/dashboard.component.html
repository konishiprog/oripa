<app-loading-overlay [isLoading]="isLoading"></app-loading-overlay>

<div class="page-header">
  <div>
    <div class="page-title">{{ "dashboard.page-title" | translate }}</div>
    <div class="page-desc">{{ "dashboard.desc" | translate }}</div>
  </div>
  <button class="btn btn-primary" (click)="onPrimaryAction()">
    {{ primaryActionLabel | translate }}
  </button>
</div>

<div class="stats-row">
  <div class="stat-card">
    <div class="stat-label">{{ "dashboard.total-boxes" | translate }}</div>
    <div class="stat-value">{{ getTotalGachaCount() }}</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">{{ "dashboard.active" | translate }}</div>
    <div class="stat-value">{{ getPublicGachaCount() }}</div>
  </div>
</div>

<div class="view-toggle" role="tablist">
  <button
    type="button"
    role="tab"
    class="view-toggle-btn"
    [class.active]="viewMode === ViewMode.Gacha"
    [attr.aria-selected]="viewMode === ViewMode.Gacha"
    (click)="setViewMode(ViewMode.Gacha)"
  >
    {{ "dashboard.view-toggle.gacha" | translate }}
  </button>
  <button
    type="button"
    role="tab"
    class="view-toggle-btn"
    [class.active]="viewMode === ViewMode.Card"
    [attr.aria-selected]="viewMode === ViewMode.Card"
    (click)="setViewMode(ViewMode.Card)"
  >
    {{ "dashboard.view-toggle.card" | translate }}
  </button>
  <button
    type="button"
    role="tab"
    class="view-toggle-btn"
    [class.active]="viewMode === ViewMode.Genre"
    [attr.aria-selected]="viewMode === ViewMode.Genre"
    (click)="setViewMode(ViewMode.Genre)"
  >
    {{ "dashboard.view-toggle.genre" | translate }}
  </button>
  <button
    type="button"
    role="tab"
    class="view-toggle-btn"
    [class.active]="viewMode === ViewMode.Effect"
    [attr.aria-selected]="viewMode === ViewMode.Effect"
    (click)="setViewMode(ViewMode.Effect)"
  >
    {{ "dashboard.view-toggle.effect" | translate }}
  </button>
</div>

<app-gacha-table
  *ngIf="viewMode === ViewMode.Gacha"
  [gachas]="gachas"
  (openCardRegistration)="openCardRegistration($event)"
  (gachasUpdated)="onGachasUpdated()"
></app-gacha-table>

<app-card-table
  *ngIf="viewMode === ViewMode.Card"
  [cards]="cards"
  (cardsUpdated)="onCardsUpdated()"
></app-card-table>

<app-genre-table
  *ngIf="viewMode === ViewMode.Genre"
  [genres]="genres"
  (genresUpdated)="loadGenres()"
></app-genre-table>

<app-effect-table
  *ngIf="viewMode === ViewMode.Effect"
  [effects]="effects"
  (effectsUpdated)="loadEffects()"
></app-effect-table>
