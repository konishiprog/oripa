<div class="filter-bar">
  <div class="filter-bar-left">
    <div class="search-input-wrap">
      <span class="search-icon" [innerHTML]="searchIcon"></span>
      <input
        type="text"
        class="search-input"
        [placeholder]="'dashboard.search-placeholder' | translate"
        [(ngModel)]="searchQuery"
        (input)="applyFilters()"
      />
    </div>
  </div>
  <div class="filter-bar-right">
    <app-pagination-filter
      [itemsPerPage]="itemsPerPage"
      (itemsPerPageChange)="onItemsPerPageChange($event)"
    ></app-pagination-filter>
  </div>
</div>

<div class="table-card">
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th *ngFor="let header of tableHeaders">
            {{ header.labelKey | translate }}
          </th>
          <th class="table-header-action"></th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let gacha of getDisplayedGachas()"
          class="table-row-clickable"
          (click)="onOpenCardRegistration(gacha)"
        >
          <ng-container *ngFor="let cell of tableCells">
            <td
              *ngIf="cell.type === 'name-with-tooltip'"
              [matTooltip]="
                'dashboard.card-registration' | translate: { name: gacha.name }
              "
              matTooltipPosition="above"
            >
              {{ gacha.name }}
            </td>
            <td *ngIf="cell.type === 'text'" class="table-text-muted">
              {{ getTextCellValue(cell, gacha) }}
            </td>

            <td *ngIf="cell.type === 'method'">
              {{ getCardUnitLabel(gacha.cards) }}
            </td>
            <td *ngIf="cell.type === 'badge'">
              <span
                class="badge"
                [ngClass]="gacha.isPublic ? 'badge-active' : 'badge-inactive'"
              >
                <span class="badge-dot"></span>
                {{ getBadgeLabel(gacha.isPublic) }}
              </span>
            </td>
            <td *ngIf="cell.type === 'date'" class="table-text-muted">
              {{
                cell.hasSpecialDisplay
                  ? getPublishEndDisplay(gacha.publishEnd)
                  : getTextCellValue(cell, gacha)
              }}
            </td>
          </ng-container>
          <td class="table-action-cell" (click)="$event.stopPropagation()">
            <app-action-menu
              (edit)="editGacha(gacha)"
              (delete)="deleteGacha(gacha)"
            ></app-action-menu>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination">
    <div class="pagination-info">
      {{ getPaginationInfo() }}
    </div>
    <div class="pagination-btns">
      <button
        class="page-btn"
        (click)="previousPage()"
        [disabled]="currentPage === 1"
      >
        <span class="page-btn-icon" [innerHTML]="chevronLeftIcon"></span>
      </button>
      <button
        *ngFor="let page of getPageNumbers()"
        class="page-btn"
        [class.active]="page === currentPage"
        [disabled]="typeof page === 'string'"
        (click)="typeof page === 'number' && goToPage(page)"
      >
        {{ page }}
      </button>
      <button
        class="page-btn"
        (click)="nextPage()"
        [disabled]="currentPage === getTotalPages()"
      >
        <span class="page-btn-icon" [innerHTML]="chevronRightIcon"></span>
      </button>
    </div>
  </div>
</div>
