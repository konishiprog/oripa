<app-loading-overlay [isLoading]="isLoading"></app-loading-overlay>

<app-table-controls
  [placeholder]="'dashboard.search-placeholder' | translate"
  [showFilterButton]="true"
  [filterActive]="isFilterActive()"
  [currentPage]="currentPage"
  [totalItems]="filteredGachas.length"
  [itemsPerPage]="itemsPerPage"
  (search)="onSearchInput($event)"
  (filterOpen)="openFilterDialog()"
  (pageChange)="onPageChange($event)"
  (itemsPerPageChange)="onItemsPerPageChange($event)"
></app-table-controls>

<div class="table-card">
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th *ngFor="let header of tableHeaders">
            {{ header.labelKey | translate }}
          </th>
          <th class="table-header-action"></th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let gacha of getDisplayedGachas()"
          class="table-row-clickable"
          (click)="onOpenCardRegistration(gacha)"
        >
          <ng-container *ngFor="let cell of tableCells">
            <td
              *ngIf="cell.type === 'name-with-tooltip'"
              [matTooltip]="
                'dashboard.card-registration' | translate: { name: gacha.name }
              "
              matTooltipPosition="above"
            >
              {{ gacha.name }}
            </td>
            <td *ngIf="cell.type === 'text'" class="table-text-muted">
              {{ getTextCellValue(cell, gacha) }}
            </td>

            <td *ngIf="cell.type === 'method'">
              {{ getCardUnitLabel(gacha.cards) }}
            </td>
            <td *ngIf="cell.type === 'badge'">
              <span
                class="badge"
                [ngClass]="gacha.isPublic ? 'badge-active' : 'badge-inactive'"
              >
                <span class="badge-dot"></span>
                {{ getBadgeLabel(gacha.isPublic) }}
              </span>
            </td>
            <td *ngIf="cell.type === 'date'" class="table-text-muted">
              {{
                cell.hasSpecialDisplay
                  ? getPublishEndDisplay(gacha.publishEnd)
                  : getTextCellValue(cell, gacha)
              }}
            </td>
          </ng-container>
          <td class="table-action-cell" (click)="$event.stopPropagation()">
            <app-action-menu
              (edit)="editGacha(gacha)"
              (delete)="deleteGacha(gacha)"
            ></app-action-menu>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
