<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>{{title}}</h1>
      </div>

      <div class="content">
        <p>{{userName}} {{greetingSuffix}}</p>

        <p>{{description}}</p>

        <div class="purchase-info">
          <div class="purchase-line">
            <strong>{{priceLabel}}</strong>
            <span>{{currencySymbol}}{{price}}</span>
          </div>
          <div class="purchase-line">
            <strong>{{pointLabel}}</strong>
            <span>{{point}} {{pointUnit}}</span>
          </div>
          <div class="purchase-line">
            <strong>{{specialPointLabel}}</strong>
            <span>{{specialPoint}} {{pointUnit}}</span>
          </div>
          <div class="purchase-line total">
            <strong>{{totalPointLabel}}</strong>
            <span>{{totalPoint}} {{pointUnit}}</span>
          </div>
        </div>

        <p>{{disclaimer}}</p>
      </div>

      <div class="footer">
        <p>{{copyright}}</p>
      </div>
    </div>
  </body>
</html>
