<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>{{title}}</h1>
      </div>

      <div class="content">
        <p>{{greeting}}</p>

        <p>{{message}}</p>

        <div class="request-info">
          <div class="request-line">
            <strong>{{userNameLabel}}</strong>
            <span>{{userName}}</span>
          </div>
          <div class="request-line">
            <strong>{{cardNameLabel}}</strong>
            <span>{{cardName}}</span>
          </div>
          <div class="request-line">
            <strong>{{gachaNameLabel}}</strong>
            <span>{{gachaName}}</span>
          </div>
          <div class="request-line">
            <strong>{{addressLabel}}</strong>
            <span>{{address}}</span>
          </div>
          <div class="request-line">
            <strong>{{phoneLabel}}</strong>
            <span>{{phone}}</span>
          </div>
        </div>

        <p>{{action}}</p>
      </div>

      <div class="footer">
        <p>{{copyright}}</p>
      </div>
    </div>
  </body>
</html>
