<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>{{title}}</h1>
      </div>

      <div class="content">
        <p>{{userName}} {{greetingSuffix}}</p>

        <p>{{description}}</p>

        <center>
          <a href="{{verifyUrl}}" class="button">{{buttonText}}</a>
        </center>

        <p>
          {{linkAlternativeText}}<br />
          <code>{{verifyUrl}}</code>
        </p>

        <div class="warning">
          <strong>{{warningLabel}}</strong> {{warningMessage}}
        </div>

        <p>{{disclaimer}}</p>
      </div>

      <div class="footer">
        <p>{{copyright}}</p>
      </div>
    </div>
  </body>
</html>
