<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Console - ログイン</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background-color: #f7f8fa;
      color: #1a202c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 0 16px;
    }

    .card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: #1a202c;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #4a5568;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      background-color: #f7f8fa;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      color: #1a202c;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input::placeholder {
      color: #a0aec0;
    }

    .form-input:focus {
      border-color: #805ad5;
      box-shadow: 0 0 0 3px rgba(128, 90, 213, 0.1);
      background-color: #fff;
    }

    .form-input.error {
      border-color: #e53e3e;
    }

    .error-message {
      font-size: 12px;
      color: #e53e3e;
      margin-top: 6px;
      display: none;
    }

    .error-message.visible {
      display: block;
    }

    .password-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #a0aec0;
      padding: 2px;
      display: flex;
      align-items: center;
    }

    .password-toggle:hover {
      color: #4a5568;
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #805ad5, #6b46c1);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.3px;
    }

    .btn-login:hover {
      opacity: 0.92;
    }

    .btn-login:active {
      transform: scale(0.99);
    }

    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .alert-error {
      background-color: #fff5f5;
      border: 1px solid #fed7d7;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #c53030;
      margin-bottom: 20px;
      display: none;
    }

    .alert-error.visible {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #a0aec0;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="card">
      <div class="card-title">ログイン</div>

      <div class="alert-error" id="alertError">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        <span id="alertText">メールアドレスまたはパスワードが正しくありません。</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">メールアドレス</label>
          <input
            class="form-input"
            id="email"
            type="email"
            placeholder="admin@example.com"
            autocomplete="email"
          />
          <div class="error-message" id="emailError">有効なメールアドレスを入力してください。</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">パスワード</label>
          <div class="password-wrapper">
            <input
              class="form-input"
              id="password"
              type="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <button type="button" class="password-toggle" id="togglePassword" aria-label="パスワードを表示">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="error-message" id="passwordError">パスワードを入力してください。</div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">ログイン</button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const alertError = document.getElementById('alertError');
    const toggleBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.innerHTML = isPassword
        ? '<line x1="1" y1="1" x2="23" y2="23"/><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><path d="M1 1l22 22"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });

    function validateEmail(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let valid = true;

      emailInput.classList.remove('error');
      passwordInput.classList.remove('error');
      emailError.classList.remove('visible');
      passwordError.classList.remove('visible');
      alertError.classList.remove('visible');

      if (!validateEmail(emailInput.value.trim())) {
        emailInput.classList.add('error');
        emailError.classList.add('visible');
        valid = false;
      }

      if (!passwordInput.value) {
        passwordInput.classList.add('error');
        passwordError.classList.add('visible');
        valid = false;
      }

      if (valid) {
        // Demo: show error after fake attempt
        alertError.classList.add('visible');
      }
    });
  </script>
</body>
</html>
