services:
  db:
    image: postgres:15
    container_name: oripa-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: oripa
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: oripa-server
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - ./server/.env

  client:
    build: ./client
    container_name: oripa-client
    ports:
      - "4200:4200"
    depends_on:
      - server

volumes:
  db-data: